# Mocked E2E (desktop Chromium + iPhone WebKit), on every PR to main and on main after the merge.
# The repository is public: GitHub-hosted runners cost no Actions minutes. Every PR runs it (the
# ruleset on main requires it); only the push to main skips documentation-only changes.
name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (mocked, desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Browsers preinstalled. Keep in sync with @playwright/test in package-lock.json
      # (also in update-snapshots.yml).
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7

      # Only for the npm cache (npm ci took ~45 s without it).
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: E2E tests
        run: npx playwright test --project=mocked --project=mocked-mobile
        env:
          CI: true
          VITE_TEST_MODE: true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
