# Same chain as « Vérifier ton travail » in CLAUDE.md, without the E2E (e2e.yml, in parallel).
name: CI

# Every PR to main, and main itself after the merge: a squash merge on a stale base can produce a
# tree no PR run has checked. The repository is public, so GitHub-hosted runners cost no minutes.
# Documentation-only changes skip it.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR (or to main) cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dead code (knip)
        run: npm run knip

      # Coverage thresholds in vitest.config.mts make this step fail below the audit targets.
      - name: Unit tests with coverage
        run: npm run test:coverage

      # `build` also runs check-dist (no source map, no test-only code in dist/).
      - name: Production build
        run: npm run build

      - name: Size budget
        run: npm run check:size
