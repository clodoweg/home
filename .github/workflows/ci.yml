# Same chain as « Vérifier ton travail » in CLAUDE.md, without the E2E: those already run locally
# (`npm run verify`) before every push, and in CI only on demand or nightly (e2e.yml).
name: CI

# Pull requests only: every change reaches main through a squash-merged PR whose tree is the one
# this workflow already checked, so re-running it on the push to main doubled the Actions minutes
# for nothing. Documentation-only changes skip it. Run it by hand on any branch if needed.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dead code (knip)
        run: npm run knip

      # Coverage thresholds in vitest.config.mts make this step fail below the audit targets.
      - name: Unit tests with coverage
        run: npm run test:coverage

      # `build` also runs check-dist (no source map, no test-only code in dist/).
      - name: Production build
        run: npm run build

      - name: Size budget
        run: npm run check:size
