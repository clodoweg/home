# Dependabot: weekly grouped update PRs (npm and GitHub Actions), checked by the usual CI.
# Security fixes come as their own grouped PR as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'Dépendances'
    ignore:
      # Must match the Playwright Docker image of e2e.yml and update-snapshots.yml, and a new
      # version means regenerating the Linux screenshots: upgraded by hand (TESTING.md).
      - dependency-name: '@playwright/test'
      # typescript-eslint (ESLint) only supports TypeScript < 6.1: TypeScript 7 fails `npm install`
      # (peer dependency). Lift this once typescript-eslint supports it, with the lint run.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'CI'
    groups:
      actions:
        patterns: ['*']
